# Tag a version (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to publish a GitHub Release
# with the standalone editor attached. The latest one is always at
# https://github.com/<owner>/lagos/releases/latest/download/flowchart-editor.html
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/flowchart-editor.html --title "$GITHUB_REF_NAME" --generate-notes
