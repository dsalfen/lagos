# Publishes a GitHub Release with the standalone editor attached. Either push a version tag
# (`git tag v1.1.0 && git push origin v1.1.0`), or use Actions → Release → Run workflow, which
# tags the latest main with the version in package.json. The latest one is always at
# https://github.com/<owner>/lagos/releases/latest/download/flowchart-editor.html
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(node -p "require('./package.json').version")"; fi
          gh release create "$TAG" dist/flowchart-editor.html --target "$GITHUB_SHA" --title "$TAG" --generate-notes
